<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e56" />
      <stop offset="100%" stop-color="#cc082b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <polygon points="50,4 92,20 92,60 50,96 8,60 8,20" fill="#0d0f15" stroke="#ff2e56" stroke-width="3" />
  <!-- Inner Red accent lines -->
  <polygon points="50,12 84,25 84,56 50,86 16,56 16,25" fill="#12151e" stroke="#252a3a" stroke-width="1.5" />
  <!-- Number 7 gamer stylized -->
  <path d="M30 32 L70 32 L50 72 L42 72 L58 40 L30 40 Z" fill="url(#redGrad)" filter="url(#glow)" />
  <!-- Small dot/star -->
  <polygon points="68,64 72,60 76,64 72,68" fill="#ffffff" />
</svg>